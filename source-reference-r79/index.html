<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航天基地 · 三维数据对照</title>
<style>html,body{margin:0;height:100%;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:#d8dedb;color:#203333}#view{position:fixed;inset:0;display:block;width:100vw;height:100vh}aside{position:fixed;z-index:2;top:16px;left:16px;width:250px;max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;padding:18px;border-radius:12px;background:#f8f8f2e8;box-shadow:0 6px 32px #14262355}h1{font-size:21px;line-height:1.2;margin:0 0 6px}p{margin:7px 0;color:#506160}button,a{display:block;box-sizing:border-box;width:100%;margin:6px 0;padding:8px 10px;border:1px solid #aab7b3;border-radius:6px;background:#fff;color:#244a4b;text-align:left;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#e2f1ed}button.active{background:#1e6664;color:#fff}small{display:block;color:#5c706c}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row button{margin:0}#progress{font-variant-numeric:tabular-nums;font-weight:600;color:#175856}#tip{position:fixed;right:18px;bottom:15px;padding:7px 11px;border-radius:7px;background:#173331bd;color:#fff}label{display:flex;align-items:center;gap:7px;margin:10px 0}input{accent-color:#176a68}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script></head><body><canvas id="view"></canvas><aside><h1>航天基地</h1><p>三维源数据对照 · 在线版</p><small>MapleEve 数据包 · Space City / htjd2</small><p id="progress">正在载入…</p><div class="row"><a href="?lod=2">快速预览</a><a href="?lod=0">高清几何</a></div><div class="row"><button data-focus="whole" class="active">全图</button><button data-focus="core">中央四室</button><button data-focus="control">中控</button><button data-focus="dorm">宿舍</button><button data-focus="industrial">工业</button><button data-focus="test">试车场</button><button data-focus="launch">发射区</button><button data-focus="dock">码头</button></div><label><input id="bounds" type="checkbox" checked>仅显示标定矩形内的几何</label><label><input id="outlines" type="checkbox">叠加 r77 手绘建筑外轮廓</label><a href="../" target="_blank">打开既有手工预览 ↗</a><small>此页用于检查实际位置、方向、体量和遗漏。黄色轮廓采用中央四室控制点近似配准，只作差异定位。包内几何尚未处理成可打印封闭模型。矩形裁切只是标定范围，不代表游戏空气墙。</small></aside><div id="tip">左键旋转 · 右键平移 · 滚轮缩放</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {loadChunk} from './source-loader.js';
const canvas=document.getElementById('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.localClippingEnabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#bdcdd0');scene.fog=new THREE.Fog('#bdcdd0',900,1800);scene.add(new THREE.HemisphereLight('#ffffff','#879294',2.0));const sun=new THREE.DirectionalLight('#ffffff',2.2);sun.position.set(6900,400,-4800);scene.add(sun);
const camera=new THREE.PerspectiveCamera(55,1,1,4000),controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.maxDistance=2400;controls.minDistance=10;
const presets={whole:[[6690,-215,-4490],800],core:[[6689,-220,-4535],235],control:[[6687,-220,-4760],240],dorm:[[6460,-221,-4685],215],industrial:[[6920,-220,-4650],280],test:[[6800,-220,-4310],265],launch:[[6590,-218,-4200],280],dock:[[6600,-220,-4395],240]};
function focus(name){const [target,distance]=presets[name];controls.target.set(...target);camera.position.set(target[0]+distance*.6,target[1]+distance*.85,target[2]+distance*.65);controls.update();for(const b of document.querySelectorAll('[data-focus]'))b.classList.toggle('active',b.dataset.focus===name)}
for(const b of document.querySelectorAll('[data-focus]'))b.onclick=()=>focus(b.dataset.focus);focus('whole');
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const planes=[new THREE.Plane(new THREE.Vector3(1,0,0),-6380.1015625),new THREE.Plane(new THREE.Vector3(-1,0,0),7017.9619140625),new THREE.Plane(new THREE.Vector3(0,0,1),4844.8657),new THREE.Plane(new THREE.Vector3(0,0,-1),-4056.1382)];
const outlineGroup=new THREE.Group();outlineGroup.visible=false;scene.add(outlineGroup);document.getElementById('outlines').onchange=e=>outlineGroup.visible=e.target.checked;
fetch('./authored-footprints.json').then(r=>r.json()).then(data=>{for(const b of data.buildings){const points=b.points.map(([x,z])=>new THREE.Vector3(x,-213,z)),geometry=new THREE.BufferGeometry().setFromPoints(points),material=new THREE.LineBasicMaterial({color:['buoyancy','centrifuge','blue','black'].includes(b.id)?'#25ffff':'#ffca42',depthTest:false});const line=new THREE.LineLoop(geometry,material);line.renderOrder=999;outlineGroup.add(line)}}).catch(console.error);
const meshes=[];function setClip(on){for(const mesh of meshes)for(const mat of Array.isArray(mesh.material)?mesh.material:[mesh.material]){mat.clippingPlanes=on?planes:[];mat.needsUpdate=true}}document.getElementById('bounds').onchange=e=>setClip(e.target.checked);
const draco=new DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/libs/draco/');draco.preload();const loader=new GLTFLoader();loader.setDRACOLoader(draco);
async function load(name){const gltf=await loader.parseAsync(await loadChunk(name),'');gltf.scene.traverse(x=>{if(x.isMesh){meshes.push(x);x.material=Array.isArray(x.material)?x.material.map(m=>m.clone()):x.material.clone();for(const mat of Array.isArray(x.material)?x.material:[x.material]){mat.side=THREE.DoubleSide;mat.clippingPlanes=document.getElementById('bounds').checked?planes:[]}}});scene.add(gltf.scene)}
function frame(){controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
const lod=new URLSearchParams(location.search).get('lod')==='0'?0:2,manifest=await (await fetch('./manifest.json')).json(),names=manifest.chunks[lod].sort((a,b)=>{const score=s=>{const m=s.match(/c_(\d+)_(-?\d+)_/);return m?(+m[1]-52)**2+(+m[2]+36)**2:999};return score(a)-score(b)});let next=0,done=0;const status=document.getElementById('progress');async function worker(){while(next<names.length){const name=names[next++];try{await load(name)}catch(e){console.error(e);status.textContent='加载异常：'+name+'（详见浏览器控制台）';continue}done++;status.textContent=`${lod===0?'高清':'快速'} · 已载入 ${done}/${names.length} 个分块`}}await Promise.all(Array.from({length:4},worker));status.textContent=`${lod===0?'高清':'快速'} · 已载入 ${done}/${names.length} 个分块`;
</script></body></html>
